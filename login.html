<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · DataWeave Lab</title><style>
:root{--bg:#07111f;--panel:#0d1a2d;--text:#edf5ff;--muted:#9db0c8;--line:#203653;--accent:#62e6c5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#18345a,transparent 40%),radial-gradient(circle at 90% 20%,#193f46,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.card{width:min(440px,92%);padding:34px;border:1px solid var(--line);border-radius:24px;background:rgba(13,26,45,.96);box-shadow:0 24px 80px #0007}h1{margin:0 0 8px}.muted{color:var(--muted)}label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#09182a;color:var(--text);font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#052018;font-weight:800;font-size:16px;cursor:pointer}.note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}.error{color:#ffb4b4;margin-top:12px}.success{color:#9ff6df;margin-top:12px}
</style></head><body><main class="card"><h1>Welcome to DataWeave Lab</h1><p class="muted">Sign in to save your local learning identity on this browser.</p><form id="loginForm"><label for="name">Name</label><input id="name" name="name" required maxlength="80" autocomplete="name"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="160" autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="4" autocomplete="current-password"><button type="submit">Login</button><div id="message" role="status"></div></form><p class="note"><strong>No backend:</strong> this login is a browser-only learning identity stored in localStorage. It is not a secure account system and must not be used for sensitive credentials.</p><p><a href="index.html" style="color:var(--accent)">← Back to DataWeave Lab</a></p></main><script src="auth.js"></script><script>
const form=document.getElementById('loginForm'),msg=document.getElementById('message');
const existing=DataWeaveAuth.getUser();
if(existing){document.getElementById('name').value=existing.name||'';document.getElementById('email').value=existing.email||'';}
form.addEventListener('submit',e=>{e.preventDefault();const user={name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim().toLowerCase()};DataWeaveAuth.saveUser(user);const first=DataWeaveAuth.markFirstLogin(user);if(first){msg.className='success';msg.textContent='Login successful. Opening your greeting email…';window.setTimeout(()=>{window.location.href=DataWeaveAuth.greetingMailto(user);},250);}else{msg.className='success';msg.textContent='Login successful. Welcome back!';window.setTimeout(()=>window.location.href='explorer.html',500);}});
</script></body></html>
