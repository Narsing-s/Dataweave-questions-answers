<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DataWeave Lab — Explorer</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07111f;color:#eef5ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.accountbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #243651;background:#081525;position:relative;z-index:50}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.brand span{color:#45e6c1}.account{display:flex;align-items:center;gap:9px}.banklink{padding:9px 12px;border:1px solid #29415d;border-radius:10px;color:#dce8f7;background:#101b30;text-decoration:none;font-weight:800}.banklink:hover{border-color:#45e6c1}.user{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #29415d;border-radius:10px;color:#dce8f7;background:#101b30;font-weight:700}.logout{padding:9px 12px;border-radius:10px;border:1px solid #6b4050;background:#241522;color:#ffdbe4;font-weight:800;cursor:pointer}.logout:hover{border-color:#ff8fa8}.labframe{display:block;width:100%;height:calc(100vh - 64px);border:0;background:#07111f}.gate{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px}.gatebox{max-width:520px;padding:30px;border:1px solid #29415d;border-radius:20px;background:#0d1a2d;text-align:center}.gatebox h1{margin-top:0}.gatebox p{color:#9db0c8}.loginbtn{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:11px;background:#62e6c5;color:#052018;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<header class="accountbar">
  <a class="brand" href="index.html">DataWeave<span>Lab</span></a>
  <div class="account">
    <a class="banklink" href="practice-bank.html">10,000 Practice Bank</a>
    <span class="user" id="userBadge">Login</span>
    <button class="logout" id="logoutBtn" type="button">Logout</button>
  </div>
</header>
<main id="app"></main>
<script src="auth.js"></script>
<script>
(() => {
  const user = DataWeaveAuth.getUser();
  const badge = document.getElementById('userBadge');
  const logout = document.getElementById('logoutBtn');
  const app = document.getElementById('app');

  if (!user) {
    badge.textContent = 'Not signed in';
    logout.hidden = true;
    app.innerHTML = '<section class="gate"><div class="gatebox"><h1>Login required</h1><p>Please sign in before opening the DataWeave Lab. Your learning identity is stored only in this browser.</p><a class="loginbtn" href="index.html">Go to Login</a></div></section>';
    return;
  }

  badge.textContent = `👤 ${user.name}`;
  badge.title = user.email || '';
  logout.addEventListener('click', () => DataWeaveAuth.logout());
  app.innerHTML = '<iframe class="labframe" src="lab-v2.html" title="DataWeave Lab Explorer" loading="eager"></iframe>';
})();
</script>
</body>
</html>
