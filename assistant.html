<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="DataWeave Lab practice assistant — search the 10,000 question bank and get guided answers.">
<title>DataWeave Lab — Practice Assistant</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(1050px,94%);margin:auto}.top{position:sticky;top:0;z-index:5;background:#07111fee;border-bottom:1px solid #243651}.bar{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.brand span{color:#45e6c1}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #29415d;background:#101b30;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800;text-decoration:none;cursor:pointer}.btn:hover{border-color:#45e6c1}.hero{padding:42px 0 22px}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:0 0 10px}.muted{color:#9db0c8}.panel{background:#101b30;border:1px solid #29415d;border-radius:16px;padding:18px}.chat{display:grid;gap:12px;margin:15px 0 40px}.messages{min-height:430px;max-height:62vh;overflow:auto;display:grid;gap:12px}.msg{padding:14px;border-radius:15px;border:1px solid #29415d;white-space:pre-wrap}.user{margin-left:10%;background:#12243a}.bot{margin-right:10%;background:#0d1a2d}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;position:sticky;bottom:10px}.composer textarea{min-height:58px;resize:vertical;background:#081525;color:#fff;border:1px solid #29415d;border-radius:12px;padding:12px;font:inherit}.result{margin-top:10px;border-top:1px solid #29415d;padding-top:12px}.code{background:#080f1d;border:1px solid #2a3b5c;border-radius:10px;padding:12px;overflow:auto;white-space:pre-wrap;font:12px/1.6 monospace}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}@media(max-width:650px){.composer{grid-template-columns:1fr}.user,.bot{margin-left:0;margin-right:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="explorer.html">DataWeave<span>Lab</span></a><nav class="nav"><a class="btn" href="explorer.html">Explorer</a><a class="btn" href="practice-bank.html">10,000 Bank</a><a class="btn" href="index.html">Account</a></nav></div></header>
<main class="wrap"><section class="hero"><h1>Practice Assistant</h1><p class="muted">Ask about a DataWeave function, transformation, interview problem, topic, or question ID. The assistant searches the repository's local 10,000-question dataset; it does not send your prompt to a remote AI service.</p><div class="chips"><button class="btn" data-q="Explain map vs mapObject">map vs mapObject</button><button class="btn" data-q="Give me an advanced aggregation question">Advanced aggregation</button><button class="btn" data-q="Show a question about filterObject">filterObject</button><button class="btn" data-q="How should I prepare for DataWeave interviews?">Interview prep</button></div></section>
<section class="chat"><div id="messages" class="panel messages"></div><div class="composer"><textarea id="prompt" placeholder="Ask: How does map work? Or search DW-00425..."></textarea><button id="send" class="btn" style="background:#45e6c1;color:#06111b;border-color:#45e6c1">Ask</button></div></section></main>
<script>
const state={all:[]};const $=id=>document.getElementById(id);const norm=x=>String(x??'').toLowerCase();
function add(role,text,html=false){const d=document.createElement('div');d.className='msg '+role;if(html)d.innerHTML=text;else d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function score(x,q){const s=norm(q), fields=[x.id,x.question,x.topic,x.difficulty,x.input,x.output,x.dataweave,x.explanation];let n=0;fields.forEach((f,i)=>{const v=norm(f);if(v===s)n+=20-i;if(v.includes(s))n+=8-i});for(const token of s.split(/\W+/).filter(t=>t.length>2)){if(norm(x.question).includes(token))n+=5;if(norm(x.topic).includes(token))n+=4;if(norm(x.dataweave).includes(token))n+=3}return n}
function format(x){return `<b>${x.id} · ${x.difficulty} · ${x.topic}</b><br><br>${escapeHtml(x.question)}<div class="result"><b>Input</b><pre class="code">${escapeHtml(x.input)}</pre><b>DataWeave</b><pre class="code">${escapeHtml(x.dataweave)}</pre><b>Expected output</b><pre class="code">${escapeHtml(x.output)}</pre><b>Explanation</b><p>${escapeHtml(x.explanation)}</p><a class="btn" href="practice-bank.html?id=${encodeURIComponent(x.id)}">Open in Practice Bank</a></div>`}
function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function answer(q){const s=norm(q);if(s.includes('map')&&s.includes('mapobject'))return 'map transforms array values by index/value, while mapObject transforms object key-value pairs. Search results below include worked examples.';if(s.includes('interview'))return 'Use the Easy → Medium → Advanced path, then practice output-prediction, debugging, nested transformations, error handling, and production scenarios. I also found matching questions below.';if(s.includes('how')&&s.includes('map'))return 'map applies a transformation to each element of an array and returns an array. Try asking for a specific map example or use the matching question below.';return 'I searched the local question bank for your request. Here are the closest matching records.'}
function search(q){return state.all.map(x=>({x,n:score(x,q)})).filter(a=>a.n>0).sort((a,b)=>b.n-a.n).slice(0,5).map(a=>a.x)}
function ask(q){q=q.trim();if(!q)return;add('user',q);if(!state.all.length){add('bot','The question bank is still loading. Please try again.');return}const hits=search(q);add('bot',answer(q));if(hits.length)hits.forEach(x=>add('bot',format(x),true));else add('bot','No close dataset match was found. Try a function name such as map, filter, reduce, mapObject, groupBy, flatten, update, match, or a question ID such as DW-00425.');}
$('send').onclick=()=>{ask($('prompt').value);$('prompt').value='';$('prompt').focus()};$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ask(b.dataset.q)});
(async()=>{try{const r=await fetch('dataset/questions-10000.json',{cache:'no-store'});const d=await r.json();state.all=Array.isArray(d)?d:(d.examples||[]);add('bot',`Ready. I loaded ${state.all.length.toLocaleString()} local practice records. Ask me about DataWeave and I will find the closest worked examples.`)}catch(e){add('bot','I could not load dataset/questions-10000.json. Use static hosting that serves repository JSON files and retry.')}})();
</script>
</body></html>
