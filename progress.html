<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataWeave Lab — Progress</title><style>body{margin:0;background:#07111f;color:#eef5ff;font:16px/1.6 system-ui,sans-serif}.wrap{width:min(1000px,92%);margin:auto}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #243651}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.brand span{color:#45e6c1}.nav a{color:#cbd9e9;text-decoration:none;margin-left:12px}.hero{padding:38px 0 18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1a2d;border:1px solid #29415d;border-radius:18px;padding:20px}.num{font-size:32px;font-weight:900;color:#45e6c1}.muted{color:#9db0c8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button{padding:11px 14px;border-radius:10px;border:1px solid #29415d;background:#101b30;color:#fff;font-weight:800;cursor:pointer}.danger{border-color:#704557;background:#241522;color:#ffdbe4}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="explorer.html">DataWeave<span>Lab</span></a><div><a href="assistant.html">Assistant</a><a href="practice-bank.html">Practice Bank</a></div></nav><main><section class="hero"><h1>Your learning progress</h1><p class="muted">Progress is stored locally in this browser. No server account or remote tracking is used.</p></section><section class="grid"><div class="card"><div class="num" id="completed">0</div><div>Completed</div></div><div class="card"><div class="num" id="bookmarks">0</div><div>Bookmarks</div></div><div class="card"><div class="num" id="wrong">0</div><div>Needs review</div></div><div class="card"><div class="num" id="streak">0</div><div>Day streak</div></div></section><section class="card" style="margin-top:18px"><h2>Question of the day</h2><p class="muted">Today's suggested practice ID</p><div class="num" id="qotd"></div><div class="actions"><a id="open" href="practice-bank.html" style="padding:11px 14px;border-radius:10px;background:#45e6c1;color:#052018;text-decoration:none;font-weight:900">Open question</a><button id="reset" class="danger">Reset learning progress</button></div><p id="status" class="muted"></p></section></main></div><script src="auth.js"></script><script src="learning.js"></script><script>if(!DataWeaveAuth.getUser())location.replace('index.html');function render(){const s=DataWeaveLearning.stats();completed.textContent=s.completed;bookmarks.textContent=s.bookmarks;wrong.textContent=s.wrong;streak.textContent=s.streak;const q=DataWeaveLearning.qotd();qotd.textContent=q;open.href='practice-bank.html?id='+encodeURIComponent(q)}render();reset.onclick=()=>{if(confirm('Reset all locally stored learning progress, bookmarks and review history?')){DataWeaveLearning.reset();render();status.textContent='Learning progress reset.'}}</script></body></html>
