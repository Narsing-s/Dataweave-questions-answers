name: Report a DataWeave Lab Problem
description: Report an incorrect, broken, ambiguous, or missing learning experience
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DataWeave question or answer
        - Expected output
        - Search or filtering
        - Dataset loading
        - Explorer or Practice Bank
        - Authentication/demo profile
        - Documentation
        - Deployment/site
        - Other
    validations:
      required: true
  - type: input
    id: question-id
    attributes:
      label: Question ID or page
      placeholder: DW-xxxxx or page name
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: runtime
    attributes:
      label: Runtime details
      description: If this concerns DataWeave execution, include the Mule/DataWeave version and input MIME type when known.
