name: Publish DataWeave Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate article package
        run: node scripts/validate-articles.mjs

      - name: Assemble public site
        run: |
          rm -rf _site
          mkdir -p _site/dataset _site/articles
          cp public-site/index.html _site/index.html
          cp dataset/questions-10000.json _site/dataset/questions-10000.json
          cp dataset/advanced-fundamentals-226-240.json _site/dataset/advanced-fundamentals-226-240.json
          cp -R articles/. _site/articles/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
