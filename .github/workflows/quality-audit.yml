name: DataWeave Lab Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run structural repository audit
        run: python scripts/quality-audit.py

      - name: Run curated Q&A duplicate audit
        run: python scripts/check-real-qa-duplicates.py
