name: Generate 10,000 DataWeave Q&A Dataset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build dataset and readable question banks
        run: python scripts/build_10000.py

      - name: Validate dataset and question files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('dataset/questions-10000.json').read_text())
          assert data['count']==10000
          assert len(data['examples'])==10000
          assert data['examples'][0]['id']=='DW-00001'
          assert data['examples'][-1]['id']=='DW-10000'
          required={'id','difficulty','topic','question','input','dataweave','output','explanation','commonMistakes','interviewTip'}
          assert all(required <= set(x) for x in data['examples'])
          assert {x['difficulty'] for x in data['examples']} == {'Easy','Medium','Advanced'}
          for folder in ['EASY','MEDIUM','ADVANCED']:
              files=list(Path(folder).glob('questions-*.md'))
              assert files, f'No generated Q&A files in {folder}'
              assert all(f.stat().st_size > 0 for f in files)
          counts={d:sum(x['difficulty']==d for x in data['examples']) for d in ['Easy','Medium','Advanced']}
          assert all(v > 0 for v in counts.values())
          print('Validated 10,000 records:', counts)
          print('Validated readable Easy/Medium/Advanced Q&A files')
          PY

      - name: Commit generated Q&A files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dataset/questions-10000.json EASY MEDIUM ADVANCED
          git diff --cached --quiet || git commit -m 'Publish 10,000 readable DataWeave Q&A examples'
          git push
