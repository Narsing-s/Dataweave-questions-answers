name: Build Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate repository
        run: python scripts/validate_examples.py

      - name: Create distribution package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist
          zip -r "dist/DataWeave-Lab-${VERSION}.zip" . \
            -x '.git/*' 'dist/*' '__pycache__/*' '*.pyc' 'node_modules/*'
          sha256sum "dist/DataWeave-Lab-${VERSION}.zip" > "dist/DataWeave-Lab-${VERSION}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataWeave-Lab-package
          path: dist/*

      - name: Set up Node.js
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Publish npm package to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Create GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
