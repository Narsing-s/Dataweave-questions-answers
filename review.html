<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>DataWeave Lab — Review</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eef5ff;font:15px/1.6 system-ui,sans-serif}.wrap{width:min(1100px,94%);margin:auto}.nav{padding:15px 0;border-bottom:1px solid #243651;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{color:#fff;text-decoration:none;font-weight:900;font-size:20px}.brand span{color:#45e6c1}.nav a,.btn{padding:9px 12px;border:1px solid #29415d;border-radius:10px;background:#101b30;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.tab.active{background:#45e6c1;color:#06111b}.list{display:grid;gap:12px}.card{background:#0d1a2d;border:1px solid #29415d;border-radius:16px;padding:17px}.pill{display:inline-block;background:#1d2b47;border-radius:7px;padding:3px 7px;font-size:11px;margin-right:5px}.muted{color:#9db0c8}.code{background:#080f1d;border:1px solid #29415d;border-radius:10px;padding:11px;overflow:auto;white-space:pre-wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="explorer.html">DataWeave<span>Lab</span></a><div><a href="progress.html">Progress</a><a href="practice-bank.html">Bank</a></div></nav><main><h1>Review Center</h1><p class="muted">Review your saved questions and questions marked as needing another attempt. Everything here is local to this browser.</p><div class="tabs"><button class="btn tab active" data-mode="bookmarks">Bookmarks</button><button class="btn tab" data-mode="wrong">Needs review</button></div><section id="list" class="list"></section></main></div><script src="auth.js"></script><script src="learning.js"></script><script>if(!DataWeaveAuth.getUser())location.replace('index.html');const $=s=>document.querySelector(s),norm=x=>String(x??'').toLowerCase(),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let all=[],mode='bookmarks';function render(){const ids=DataWeaveLearning.state()[mode]||[],rows=ids.map(id=>all.find(x=>x.id===id)).filter(Boolean);$('#list').innerHTML=rows.length?rows.map(x=>`<article class="card"><span class="pill">${esc(x.id)}</span><span class="pill">${esc(x.difficulty)}</span><span class="pill">${esc(x.topic)}</span><h2>${esc(x.question)}</h2><div class="code">${esc(x.dataweave)}</div><p class="muted">${esc(x.explanation)}</p><div class="actions"><a class="btn" href="practice-bank.html?id=${encodeURIComponent(x.id)}">Open</a><button class="btn" onclick="removeItem('${x.id}')">Remove from ${mode==='bookmarks'?'bookmarks':'review'}</button></div></article>`).join(''):`<div class="card"><h2>Nothing here yet</h2><p class="muted">Use the learning controls while practicing to build this list.</p></div>`}function removeItem(id){if(mode==='bookmarks')DataWeaveLearning.toggleBookmark(id);else{const s=DataWeaveLearning.state();s.wrong=s.wrong.filter(x=>x!==id);localStorage.setItem('dataweave-lab-learning-v2',JSON.stringify(s))}render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});fetch('dataset/questions-10000.json').then(r=>r.json()).then(d=>{all=Array.isArray(d)?d:(d.examples||[]);render()}).catch(()=>$('#list').innerHTML='<div class="card">Question bank could not be loaded. Serve the repository over HTTP(S).</div>');</script></body></html>
